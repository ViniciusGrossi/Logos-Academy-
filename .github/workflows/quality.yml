name: Quality gate

on:
  push:
    branches: [main, validate/atlas-cms-pgtap]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  application:
    name: Application quality
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-publishable-key
      SUPABASE_SECRET_KEY: ci-secret-key
      PII_ENCRYPTION_KEY: ci-encryption-key
      NEXT_PUBLIC_DEMO_MODE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  database-contracts:
    name: Database contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start isolated Supabase stack
        run: npx --yes supabase@2.118.0 start
      - name: Run Atlas CMS pgTAP contracts
        if: github.ref == 'refs/heads/validate/atlas-cms-pgtap'
        run: npx --yes supabase@2.118.0 test db supabase/tests/059_atlas_cms_v2.test.sql
      - name: Run pgTAP contracts
        if: github.ref != 'refs/heads/validate/atlas-cms-pgtap'
        run: npm run test:db
